<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- Brand mint rounded square — instantly recognizable across browser themes -->
  <rect width="32" height="32" rx="6" fill="#8CE0B3"/>
  <!-- Kraken head silhouette (no tentacles — would be illegible at 16x16) -->
  <path d="M16 5.5 C 9.5 5.5, 5.8 9.5, 5.8 14.5 L 5.8 18.5 C 5.8 21.5, 8 23.5, 10.5 24 C 11 25.5, 12 26.5, 13.2 26.5 C 14.3 26.5, 15 25.8, 15.4 25 L 16.6 25 C 17 25.8, 17.7 26.5, 18.8 26.5 C 20 26.5, 21 25.5, 21.5 24 C 24 23.5, 26.2 21.5, 26.2 18.5 L 26.2 14.5 C 26.2 9.5, 22.5 5.5, 16 5.5 Z" fill="#0A0A0A"/>
  <!-- Big white eyes — the kraken's signature -->
  <circle cx="12.5" cy="14.5" r="2.8" fill="#F2EFE6"/>
  <circle cx="19.5" cy="14.5" r="2.8" fill="#F2EFE6"/>
  <!-- Dark pupils -->
  <circle cx="12.5" cy="15" r="1.3" fill="#0A0A0A"/>
  <circle cx="19.5" cy="15" r="1.3" fill="#0A0A0A"/>
  <!-- Tiny star highlight in each pupil — brand-consistent with the * after POOKIESCROLL -->
  <circle cx="13.1" cy="14.5" r="0.5" fill="#F2EFE6"/>
  <circle cx="20.1" cy="14.5" r="0.5" fill="#F2EFE6"/>
</svg>
